name: Generate keys (one time)
# Run once from the Actions tab. Copy the values from the log into Vercel and GitHub Secrets,
# then delete the run (… menu > Delete workflow run) so the values don't stay in the log.
on: workflow_dispatch
jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          npx tsx scripts/vapid.ts
          echo "SESSION_SECRET=$(openssl rand -hex 32)"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
